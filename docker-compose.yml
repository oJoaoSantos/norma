services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: norma
      POSTGRES_PASSWORD: norma
      POSTGRES_DB: norma
    volumes:
      - norma_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norma -d norma"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Corre as migrações (e o seed inicial, que é idempotente) uma vez antes
  # da app arrancar. Usa o stage "builder" do Dockerfile, não o "runner"
  # final — é o único que tem drizzle-kit/tsx (devDependencies) instalados.
  migrate:
    build:
      context: .
      target: builder
    command: sh -c "npm run db:migrate && npm run db:seed-admin"
    env_file: .env
    environment:
      DATABASE_URL: postgres://norma:norma@db:5432/norma
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://norma:norma@db:5432/norma
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - norma_caddy_data:/data
      - norma_caddy_config:/config
    depends_on:
      - app

volumes:
  norma_db_data:
  norma_caddy_data:
  norma_caddy_config:
