services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: norma
      POSTGRES_PASSWORD: norma
      POSTGRES_DB: norma
    ports:
      - "5432:5432"
    volumes:
      - norma_db_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - norma_ollama_data:/root/.ollama

volumes:
  norma_db_data:
  norma_ollama_data:
